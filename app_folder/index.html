<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        #chatbox { width: 80%; max-width: 600px; margin: auto; border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto; }
        #userInput, #chatbox, #sendBtn { display: none; } /* Hide chat until student is verified */
        input, button { padding: 10px; margin: 5px; }
    </style>
</head>
<body>

    <img src="onePal image.jpg" width="350">
    <h1>onePal here !! Ask me anything.</h1>

    <div id="studentLogin">
        <input type="text" id="studentID" placeholder="Student ID" />
        <input type="text" id="firstName" placeholder="First Name" />
        <input type="text" id="lastName" placeholder="Last Name" />
        <button onclick="validateStudent()">Verify</button>
    </div>

    <div id="chatSection">
        <div id="chatbox"></div>
        <input type="text" id="userInput" placeholder="Type a message..."/>
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>

    <!-- Include External JavaScript -->
    <script src="app_javaScript_code.js"></script>

</body>
</html>
